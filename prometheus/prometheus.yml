global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "timestral-forecaster"
    static_configs:
      - targets: ["host.docker.internal:9100", "172.17.0.1:9100", "localhost:9100"]

  - job_name: "vllm"
    static_configs:
      - targets: ["host.docker.internal:8000", "vllm:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
