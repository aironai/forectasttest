[project]
name = "forectasttest"
version = "0.1.0"
description = "Zero-overhead time-series forecasting PoC for vLLM on 8x B300 HGX using Mistral Timestral"
readme = "README.md"
authors = [
    { name = "Jonas Lind", email = "jonas.lind@ai.se" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "requests>=2.28.1",
    "ruff>=0.17.1",
    "timestral",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
vllm-forecast = "src.service:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
